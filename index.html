<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 聖誕快樂！來自 Shijianus 的祝福</title>

    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:title" content="🎄 聖誕快樂！" />
    <meta property="og:description" content="點擊拆開我為你準備的聖誕禮物..." />
    <meta property="og:image" content="https://christmas-dvs.pages.dev/preview.jpg" />
    <meta property="og:url" content="https://christmas-dvs.pages.dev" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Great+Vibes&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a472a, #2d5a3f);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            position: relative;
            transition: background 1s ease;
            cursor: default;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 動態背景圖層 */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: -2;
            pointer-events: none;
        }

        .background-layer.active {
            opacity: 0.4;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
            pointer-events: none;
        }

        body.christmas-eve {
            background: linear-gradient(135deg, #0f2a1a 0%, #1a3d2f 50%, #0f2a1a 100%);
        }

        body.christmas-day {
            background: linear-gradient(135deg, #2a1a0f 0%, #3d2f1a 50%, #2a1a0f 100%);
        }

        /* 雪花效果 */
        .snowflake {
            position: fixed;
            color: white;
            font-size: 1em;
            top: -20px;
            z-index: 9999;
            animation: fall linear infinite;
            opacity: 0.8;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            cursor: default;
        }

        @keyframes fall {
            0% {
                top: -10%;
                transform: translateX(0px) rotate(0deg);
            }
            100% {
                top: 100%;
                transform: translateX(100px) rotate(360deg);
            }
        }

        /* 清風粒子效果 */
        .breeze-particle {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            border-radius: 50%;
            animation: breezeFloat 2s ease-out forwards;
        }

        @keyframes breezeFloat {
            0% {
                opacity: 0.8;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Lottie 聖誕樹 */
        .lottie-tree {
            width: 250px;
            height: 250px;
            margin: 0 auto 30px;
            cursor: pointer;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
            transition: transform 0.3s ease;
        }

        .lottie-tree:hover {
            transform: scale(1.1);
        }

        .message {
            text-align: center;
            color: white;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(45deg, #FFD700, #FFA500, #FF6347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: #FFE4B5;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        .location-info {
            font-size: 1.2em;
            color: #90EE90;
            margin-top: 20px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        /* 時間顯示區塊 */
        .countdown-container {
            margin: 30px 0;
            padding: 25px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            border: 3px solid rgba(255, 215, 0, 0.5);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.8s ease-out;
            min-width: 300px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .phase-badge {
            display: inline-block;
            padding: 10px 25px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a472a;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .countdown {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .countdown-item {
            text-align: center;
            min-width: 80px;
        }

        .countdown-number {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 3em;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            display: block;
        }

        .countdown-label {
            font-size: 0.9em;
            color: #FFE4B5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 特殊時間顯示 */
        .special-time-display {
            text-align: center;
            font-size: 1.5em;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            padding: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            }
            to {
                text-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 30px rgba(255, 215, 0, 0.8);
            }
        }

        /* 活動卡片 */
        .activities-card {
            margin-top: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            border: 2px solid rgba(255, 215, 0, 0.4);
            max-width: 600px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .activities-title {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 1.5em;
            color: #FFD700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        .activity-item {
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .activity-item:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateX(5px);
        }

        .activity-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .activity-icon {
            font-size: 1.5em;
        }

        /* 翻轉卡片 - 修復點擊區域 */
        .greeting-card {
            margin-top: 30px;
            perspective: 1000px;
            display: flex;
            justify-content: center;
        }

        .card-inner {
            position: relative;
            width: 320px;
            height: 220px;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.open {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .card-front {
            background: linear-gradient(135deg, #8B0000, #C41E3A);
            border: 3px solid #FFD700;
        }

        .card-back {
            background: linear-gradient(135deg, #1a472a, #2d5a3f);
            border: 3px solid #FFD700;
            transform: rotateY(180deg);
        }

        .card-hint {
            color: #FFD700;
            font-size: 0.9em;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .card-message {
            color: white;
            font-size: 1.1em;
            line-height: 1.6;
        }

        /* 音樂控制 */
        .music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
        }

        .music-control:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }

        .music-control.playing {
            animation: none;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(255, 215, 0, 0);
            }
        }

        .music-control svg {
            width: 30px;
            height: 30px;
            fill: #FFD700;
        }

        /* 聖誕彩燈 */
        .lights {
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 0;
            margin: 0;
            pointer-events: none;
        }

        .lights li {
            position: relative;
            list-style: none;
            margin: 20px;
            padding: 0;
            display: inline-block;
            width: 12px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            animation: flash 2s infinite alternate;
        }

        .lights li:nth-child(2n+1) { background: #ff0000; animation-duration: 0.4s; }
        .lights li:nth-child(4n+2) { background: #ffa500; animation-duration: 1.1s; }
        .lights li:nth-child(3n+2) { background: #00ff00; animation-duration: 1.5s; }

        @keyframes flash {
            0%, 100% { opacity: 1; box-shadow: 0 0 20px currentColor; }
            50% { opacity: 0.2; box-shadow: 0 0 0 transparent; }
        }

        /* 飛行的聖誕老人 */
        .santa-sleigh {
            position: fixed;
            top: 10%;
            left: -200px;
            width: 150px;
            opacity: 0.8;
            animation: fly 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes fly {
            0% { left: -200px; transform: translateY(0); }
            25% { transform: translateY(20px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(-20px); }
            100% { left: 110%; transform: translateY(0); }
        }

        /* 拍立得照片牆 */
        .polaroid-container {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
        }

        .polaroid {
            background: white;
            padding: 10px 10px 30px 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transform: rotate(-3deg);
            max-width: 200px;
            border-radius: 4px;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .polaroid:nth-child(even) {
            transform: rotate(3deg);
        }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.05);
            z-index: 10;
        }

        .polaroid img {
            width: 100%;
            display: block;
            border-radius: 2px;
        }

        .polaroid .caption {
            text-align: center;
            font-family: 'Mountains of Christmas', cursive;
            color: #333;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1em;
        }

        /* 新年倒數計時器 */
        .newyear-countdown {
            margin-top: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            border: 3px solid rgba(255, 215, 0, 0.5);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.8s ease-out;
            max-width: 600px;
        }

        .newyear-title {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 1.5em;
            color: #FFD700;
            margin-bottom: 15px;
            text-align: center;
        }

        /* 分享按鈕 */
        .share-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .share-btn {
            padding: 10px 20px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #FFD700;
            border-radius: 25px;
            color: #FFD700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .share-btn:hover {
            background: rgba(255, 215, 0, 0.4);
            transform: translateY(-3px);
        }

        /* 互動提示 */
        .interaction-hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 215, 0, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            color: #FFD700;
            font-size: 0.9em;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            animation: fadeInOut 4s ease-in-out infinite;
            z-index: 999;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 禮物開啟畫面 */
        .gift-opening-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .gift-box {
            font-size: 150px;
            cursor: pointer;
            animation: giftBounce 2s ease-in-out infinite;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
        }

        .gift-box:hover {
            transform: scale(1.1);
        }

        @keyframes giftBounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-30px);
            }
        }

        .gift-hint {
            margin-top: 30px;
            font-family: 'Mountains of Christmas', cursive;
            font-size: 1.8em;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        .main-content {
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .main-content.show {
            display: block;
            opacity: 1;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }
            .subtitle {
                font-size: 1.3em;
            }
            .location-info {
                font-size: 1em;
                padding: 10px 20px;
            }
            .countdown-number {
                font-size: 2em;
            }
            .countdown-item {
                min-width: 60px;
            }
            .phase-badge {
                font-size: 1em;
                padding: 8px 15px;
            }
            .card-inner {
                width: 280px;
                height: 200px;
            }
            .gift-box {
                font-size: 100px;
            }
            .gift-hint {
                font-size: 1.3em;
            }
            .lottie-tree {
                width: 180px;
                height: 180px;
            }
            .activities-card {
                padding: 15px;
                width: 90%;
            }
            .activities-title {
                font-size: 1.2em;
            }
            .activity-item {
                padding: 10px;
                font-size: 0.9em;
            }
            .share-btn {
                padding: 8px 15px;
                font-size: 0.9em;
            }
            .music-control {
                width: 50px;
                height: 50px;
                bottom: 20px;
                right: 20px;
            }
            .music-control svg {
                width: 25px;
                height: 25px;
            }
            .interaction-hint {
                font-size: 0.8em;
                padding: 8px 15px;
                bottom: 80px;
            }
            .polaroid {
                max-width: 150px;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem !important;
            }
            .subtitle {
                font-size: 1.2rem !important;
            }
            .location-info {
                font-size: 0.9rem !important;
                padding: 10px 15px;
            }
            .countdown-container {
                padding: 15px;
                width: 90%;
            }
            .countdown-number {
                font-size: 1.5em;
            }
            .countdown-item {
                min-width: 50px;
            }
            .countdown-label {
                font-size: 0.7em;
            }
            .phase-badge {
                font-size: 0.9em;
                padding: 6px 12px;
            }
            .card-inner {
                width: 260px;
                height: 180px;
            }
            .card-front, .card-back {
                padding: 15px;
            }
            .card-message {
                font-size: 1em;
            }
            .gift-box {
                font-size: 80px;
            }
            .gift-hint {
                font-size: 1.1em;
                padding: 0 10px;
                text-align: center;
            }
            .lottie-tree {
                width: 150px;
                height: 150px;
            }
            .special-time-display {
                font-size: 1.2em;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- 動態背景層 -->
    <div class="background-layer" id="bgLayer"></div>
    <div class="background-overlay"></div>

    <!-- 聖誕彩燈 -->
    <ul class="lights">
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- 飛行的聖誕老人 -->
    <img src="https://cdn-icons-png.flaticon.com/512/3799/3799988.png" class="santa-sleigh" alt="Santa">

    <!-- Gift Opening Screen -->
    <div class="gift-opening-container" id="giftOpening">
        <div class="gift-box" id="giftBox" onclick="openGift()">🎁</div>
        <div class="gift-hint" id="giftHint">點擊打開你的聖誕禮物！</div>
    </div>

    <!-- Main Content (Hidden Initially) -->
    <div class="container main-content" id="mainContent">
        <lottie-player
            class="lottie-tree"
            src="https://assets3.lottiefiles.com/packages/lf20_u4yrau.json"
            background="transparent"
            speed="1"
            loop
            autoplay
            onclick="shakeTree()">
        </lottie-player>

        <div class="message">
            <h1 id="greeting">聖誕快樂！</h1>
            <p class="subtitle" id="subtitle">祝你幸福快樂</p>

            <div class="location-info" id="locationInfo">
                正在偵測你的位置...
            </div>

            <!-- 時間顯示容器 -->
            <div class="countdown-container" id="countdownContainer">
                <div class="phase-badge" id="phaseBadge">🎄 準備迎接聖誕節</div>

                <!-- 倒數計時 (預設顯示) -->
                <div class="countdown" id="countdown">
                    <div class="countdown-item">
                        <span class="countdown-number" id="days">00</span>
                        <span class="countdown-label" id="daysLabel">天</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number" id="hours">00</span>
                        <span class="countdown-label" id="hoursLabel">時</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-number" id="minutes">00</span>

        // ========== 彩帶慶祝 ==========
        function triggerConfetti() {
            const duration = 3000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            // 額外的慶祝爆發
            setTimeout(() => {
                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { y: 0.6 },
                    colors: ['#FFD700', '#FFA500', '#FF6347', '#00FF00', '#FFFFFF']
                });
            }, 500);
        }

        // ========== 清風效果 ==========
        let lastMouseX = 0;
        let lastMouseY = 0;
        let mouseSpeed = 0;

        document.addEventListener('mousemove', function(e) {
            const currentX = e.clientX;
            const currentY = e.clientY;

            // 計算滑鼠速度
            const dx = currentX - lastMouseX;
            const dy = currentY - lastMouseY;
            mouseSpeed = Math.sqrt(dx * dx + dy * dy);

            // 根據滑鼠速度創建粒子
            if (mouseSpeed > 5) {
                createBreezeParticle(currentX, currentY, dx, dy);
            }

            lastMouseX = currentX;
            lastMouseY = currentY;
        });

        function createBreezeParticle(x, y, dx, dy) {
            const particle = document.createElement('div');
            particle.className = 'breeze-particle';

            const colors = ['#FFD700', '#FFA500', '#FFFFFF', '#90EE90', '#87CEEB'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const size = Math.random() * 8 + 4;

            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.background = color;
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.boxShadow = `0 0 ${size}px ${color}`;

            // 根據滑鼠移動方向設置粒子移動方向
            const angle = Math.atan2(dy, dx);
            const distance = Math.random() * 50 + 30;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;

            particle.style.setProperty('--tx', tx + 'px');
            particle.style.setProperty('--ty', ty + 'px');

            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 2000);
        }

        // ========== 獲取當前聖誕節階段 ==========
        function getChristmasPhase() {
            const now = new Date();
            const userDate = new Date(now.toLocaleString('en-US', { timeZone: userTimezone }));

            const month = userDate.getMonth();
            const day = userDate.getDate();
            const hour = userDate.getHours();

            // Christmas Eve (Dec 24)
            if (month === 11 && day === 24) {
                return { phase: 'eve', hour: hour };
            }
            // Christmas Day (Dec 25)
            else if (month === 11 && day === 25) {
                return { phase: 'day', hour: hour };
            }
            // Day after Christmas (Dec 26 - Jan 6)
            else if (month === 11 && day > 25) {
                return { phase: 'after', hour: hour };
            }
            // Before Christmas
            else {
                return { phase: 'preparing', hour: hour };
            }
        }

        // ========== 獲取時間段描述 ==========
        function getTimeOfDayLabel(phase, hour) {
            const t = translations[currentLanguage];

            if (phase === 'eve') {
                if (hour >= 5 && hour < 12) return t.eveMorning;
                else if (hour >= 12 && hour < 17) return t.eveAfternoon;
                else if (hour >= 17 && hour < 21) return t.eveEvening;
                else return t.eveNight;
            } else if (phase === 'day') {
                if (hour >= 5 && hour < 12) return t.dayMorning;
                else if (hour >= 12 && hour < 17) return t.dayAfternoon;
                else if (hour >= 17 && hour < 21) return t.dayEvening;
                else return t.dayNight;
            }
            return null;
        }

        // ========== 更新倒數 ==========
        function updateCountdown() {
            const now = new Date();
            const userNow = new Date(now.toLocaleString('en-US', { timeZone: userTimezone }));

            // 聖誕節午夜（用戶時區）
            const christmas = new Date(userNow.getFullYear(), 11, 25, 0, 0, 0);

            // 如果聖誕節已過，計算到明年
            if (userNow > christmas) {
                christmas.setFullYear(christmas.getFullYear() + 1);
            }

            const phaseInfo = getChristmasPhase();
            const phase = phaseInfo.phase;
            const hour = phaseInfo.hour;
            christmasPhase = phase;

            const t = translations[currentLanguage];
            const countdownEl = document.getElementById('countdown');
            const specialTimeEl = document.getElementById('specialTimeDisplay');
            const badge = document.getElementById('phaseBadge');
            const body = document.body;

            // 移除所有階段類
            body.classList.remove('christmas-eve', 'christmas-day');

            // 根據階段更新顯示
            if (phase === 'eve' || phase === 'day') {
                // 隱藏倒數，顯示特殊時間
                countdownEl.style.display = 'none';
                specialTimeEl.style.display = 'block';

                const timeLabel = getTimeOfDayLabel(phase, hour);
                specialTimeEl.innerHTML = timeLabel;

                if (phase === 'eve') {
                    badge.textContent = t.phaseEve;
                    body.classList.add('christmas-eve');
                } else {
                    badge.textContent = t.phaseDay;
                    body.classList.add('christmas-day');
                }

                // 顯示活動推薦
                showActivities(phase);
            } else if (phase === 'after') {
                countdownEl.style.display = 'none';
                specialTimeEl.style.display = 'block';
                specialTimeEl.innerHTML = '🎄 ' + t.phaseAfter;
                badge.textContent = t.phaseAfter;
            } else {
                // 顯示倒數計時
                countdownEl.style.display = 'flex';
                specialTimeEl.style.display = 'none';
                badge.textContent = t.phasePreparing;

                const diffTime = christmas - userNow;
                const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diffTime % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diffTime % (1000 * 60)) / 1000);

                // 更新倒數數字
                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

                // 更新標籤
                document.getElementById('daysLabel').textContent = t.days;
                document.getElementById('hoursLabel').textContent = t.hours;
                document.getElementById('minutesLabel').textContent = t.minutes;
                document.getElementById('secondsLabel').textContent = t.seconds;
            }
        }

        // ========== 顯示活動推薦 ==========

            const activitiesCard = document.getElementById('activitiesCard');
            const activitiesList = document.getElementById('activitiesList');
            const activitiesTitle = document.getElementById('activitiesTitle');
            const t = translations[currentLanguage];

            const countryCode = locationData?.countryCode || 'default';
            const activities = culturalActivities[countryCode] || culturalActivities['default'];
            const currentActivities = phase === 'eve' ? activities.eve : activities.day;

            activitiesTitle.textContent = phase === 'eve' ? t.activitiesTitle : t.activitiesTitleDay;
            activitiesList.innerHTML = '';

            currentActivities.forEach((activity, index) => {
                const item = document.createElement('div');
                item.className = 'activity-item';
                item.innerHTML = `<span class="activity-icon">${activity.icon}</span><span>${activity.text}</span>`;
                item.onclick = function() {
                    this.classList.toggle('completed');
                    if (this.classList.contains('completed')) {

                        confetti({
                            particleCount: 15,
                            spread: 30,
                            origin: { y: 0.7 },
                            colors: ['#FFD700', '#FFA500']
                        });
                    }
                };
                activitiesList.appendChild(item);
            });

            activitiesCard.style.display = 'block';
        }

            document.getElementById('cardMessage').innerHTML = t.cardMessage;
            document.getElementById('giftHint').textContent = t.openGift;
            document.getElementById('interactionHint').textContent = t.interactionHint;

            updateCountdown();
        }

        // ========== 音樂控制 ==========
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const icon = document.getElementById('musicIcon');
            const control = document.getElementById('musicControl');

            if (musicPlaying) {
                music.pause();
                icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                control.classList.remove('playing');
            } else {
                music.play().catch(e => console.log('音樂播放失敗:', e));
                icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                control.classList.add('playing');
            }
            musicPlaying = !musicPlaying;
        }

        // ========== 新年倒數 ==========
        function updateNewYearCountdown() {
            const now = new Date();
            const nextYear = now.getFullYear() + 1;
            const newYearDate = new Date(`January 1, ${nextYear} 00:00:00`).getTime();
            const currentTime = now.getTime();
            const gap = newYearDate - currentTime;

            if (gap > 0) {
                const days = Math.floor(gap / (1000 * 60 * 60 * 24));
                const hours = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((gap % (1000 * 60)) / 1000);

                document.getElementById("newyearCountdown").innerHTML =
                    `${days} 天 ${hours} 時 ${minutes} 分 ${seconds} 秒`;
            } else {
                document.getElementById("newyearCountdown").innerHTML = "🎉 新年快樂！ 🎉";
            }
        }

        // ========== 初始化 ==========
        window.onload = function() {
            createSnowflakes();

            // 持續創建雪花
            setInterval(createSnowflakes, 5000);
        };

        // 禮物打開後初始化
        function initializeAfterGiftOpen() {
            detectLocation();
            // 更新倒數每秒
            setInterval(updateCountdown, 1000);
            // 更新年倒數
            updateNewYearCountdown();
            setInterval(updateNewYearCountdown, 1000);
        }
    </script>
</body>
</html>
